[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ratgpt"
version = "0.1.0"
description = "Codex remote-control red-team research client"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "httpx>=0.27",
  "websockets>=12",
]

[project.scripts]
ratgpt = "ratgpt.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ratgpt*"]
